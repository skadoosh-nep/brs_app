<body class="bg-background text-on-background font-body-md selection:bg-secondary-container selection:text-on-secondary-container">
<main class="min-h-screen flex items-center justify-center p-md construction-overlay relative overflow-hidden">
<!-- Background Grid Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(#091426 1px, transparent 1px); background-size: 24px 24px;"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Login Card -->

<!-- Brand Anchor -->

<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-md">

</div>

</div>
<!-- Header -->

<h2 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Access your financial oversight dashboard</p>
</div>
<!-- Form -->
<form class="space-y-lg" onsubmit="event.preventDefault()">
<!-- Email Field -->

<input class="w-full h-14 px-md pt-base border border-outline rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary bg-transparent text-on-surface font-body-md transition-all" id="email" placeholder=" " required="" type="email"/>
<label class="font-body-md text-on-surface-variant" for="email">Corporate Email Address</label>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="floating-label-group">
<input class="w-full h-14 px-md pt-base border border-outline rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary bg-transparent text-on-surface font-body-md transition-all" id="password" placeholder=" " required="" type="password"/>
<label class="font-body-md text-on-surface-variant" for="password">Security Password</label>
</div>
<div class="flex justify-end">
<a class="font-label-caps text-label-caps text-secondary hover:text-on-secondary-container transition-colors duration-200" href="#">Forgot Password?</a>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary text-on-primary font-title-md text-title-md rounded-lg hover:bg-tertiary transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-sm" type="submit">

</div>

<script>
        // Micro-interaction for the button
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            const originalContent = loginBtn.innerHTML;
            loginBtn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Authenticating...`;
            loginBtn.classList.add('opacity-90');
            
            setTimeout(() => {
                loginBtn.innerHTML = originalContent;
                loginBtn.classList.remove('opacity-90');
            }, 1500);
        });

        // Simple floating label persistence check
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                if(input.value !== "") {
                    input.classList.add('has-value');
                } else {
                    input.classList.remove('has-value');
                }
            });
        });
    </script>
