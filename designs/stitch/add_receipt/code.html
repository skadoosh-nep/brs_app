<body class="bg-surface-bright text-on-surface">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center px-gutter h-16">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary">Add Receipt</h1>
</div>
<div class="flex items-center gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">history</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 pb-44 px-gutter max-w-lg mx-auto">
<!-- Header Info Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-lg mb-gutter shadow-sm">
<div class="flex justify-between items-start mb-md">
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 block">RECEIPT NUMBER</label>
<p class="font-label-data text-label-data text-primary">MR-2023-0892</p>
</div>
<span class="bg-secondary-container/20 text-secondary font-label-caps text-label-caps px-2 py-1 rounded border border-secondary/20">DRAFT</span>
</div>
<div class="space-y-lg">
<!-- Date Field -->
<div>
<label class="font-body-sm font-medium text-on-surface-variant mb-1 block">Date</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded px-md py-2.5 font-body-md focus:border-primary focus:ring-0 transition-colors" readonly="" type="text" value="24 Oct 2023"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-on-surface-variant">calendar_today</span>
</div>
</div>
<!-- Project Field -->
<div>
<label class="font-body-sm font-medium text-on-surface-variant mb-1 block">Project</label>
<div class="relative">
<select class="w-full bg-surface-bright border border-outline-variant rounded px-md py-2.5 font-body-md appearance-none focus:border-primary focus:ring-0 transition-colors">
<option>Skyline Residency - Block A</option>
<option>Harmony Gardens - Phase 2</option>
<option>Emerald Heights Tower</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Received From -->
<div>
<label class="font-body-sm font-medium text-on-surface-variant mb-1 block">Received From</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded px-md py-2.5 font-body-md focus:border-primary focus:ring-0 transition-colors" placeholder="Enter name or entity" type="text"/>
</div>
<!-- Payment Mode -->
<div>
<label class="font-body-sm font-medium text-on-surface-variant mb-1 block">Payment Mode</label>
<div class="grid grid-cols-3 gap-2">
<button class="border border-secondary bg-secondary-container/10 text-secondary rounded py-2 font-label-data text-label-data flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">payments</span> Cash
                        </button>
<button class="border border-outline-variant hover:border-outline text-on-surface-variant rounded py-2 font-label-data text-label-data flex items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-[18px]">account_balance</span> Bank
                        </button>
<button class="border border-outline-variant hover:border-outline text-on-surface-variant rounded py-2 font-label-data text-label-data flex items-center justify-center gap-1 transition-colors">

<div class="space-y-md pt-2">
<div>

<option>Customer Advance</option>
<option>Security Deposit</option>
<option>Rent Income</option>
<option>Miscellaneous Receipts</option>
</select>

</div>
</div>

<div>

<textarea class="w-full bg-surface-bright border border-outline-variant rounded px-md py-2 font-body-md focus:border-primary focus:ring-0 resize-none" placeholder="Brief explanation..." rows="2"></textarea>
</div>
</div>
</div>

<button class="w-full py-4 border-2 border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center gap-1 hover:bg-surface-container-low hover:border-outline transition-all group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">add_circle</span>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-primary transition-colors">ADD LINE ITEM</span>
</button>

<div class="max-w-lg mx-auto">
<div class="flex justify-between items-end mb-lg">
<div>
<h3 class="font-label-caps text-label-caps text-on-tertiary-container mb-1">RECEIPT SUMMARY</h3>

</div>
<div class="text-right">

<p class="font-label-data text-2xl text-secondary-fixed">₹ 0.00</p>
</div>
</div>

                    Cancel

<button class="flex-[2] py-3 bg-secondary-container text-on-secondary-container rounded-lg font-title-md text-title-md hover:opacity-90 active:scale-[0.98] transition-all shadow-md">

                </button>
</div>

<!-- Bottom NavBar Logic (Only for Root Pages) -->
<!-- Suppressed for transactional Add Receipt page -->
<script>
        // Simple micro-interaction for amount changes (visual only)
        const amountInput = document.querySelector('input[type="number"]');
        const summaryTotal = document.querySelector('.text-secondary-fixed');
        
        amountInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value) || 0;
            summaryTotal.innerText = `₹ ${val.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        });

        // Toggle payment modes
        const paymentButtons = document.querySelectorAll('.grid-cols-3 button');
        paymentButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                paymentButtons.forEach(b => {
                    b.classList.remove('border-secondary', 'bg-secondary-container/10', 'text-secondary');
                    b.classList.add('border-outline-variant', 'text-on-surface-variant');
                    const icon = b.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                btn.classList.add('border-secondary', 'bg-secondary-container/10', 'text-secondary');
                btn.classList.remove('border-outline-variant', 'text-on-surface-variant');
                const icon = btn.querySelector('.material-symbols-outlined');
                if(icon) icon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
</body></html>
