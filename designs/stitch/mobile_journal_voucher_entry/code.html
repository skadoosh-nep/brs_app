<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Journal Voucher | NirmanFlow</title>

                    "on-primary-fixed": "#111c2d",
                    "surface-container": "#eceef0",
                    "secondary-container": "#fea619",
                    "on-tertiary-fixed": "#131b2e",
                    "primary-container": "#1e293b",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "error-container": "#ffdad6",
                    "surface-tint": "#545f73",
                    "outline": "#75777d",
                    "inverse-surface": "#2d3133",
                    "on-tertiary-container": "#888fa7",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .data-dense-input { transition: border-color 0.2s ease; }
        .data-dense-input:focus { outline: none; border-color: #091426; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flex justify-between items-center px-md h-16 w-full">
<div class="flex items-center gap-md">
<button class="p-xs hover:bg-surface-container rounded-full transition-colors duration-200 active:opacity-70">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">JV</h1>
</div>
<div class="flex items-center gap-xs">
<button class="p-xs hover:bg-surface-container rounded-full transition-colors duration-200 active:opacity-70">
<span class="material-symbols-outlined text-on-surface-variant">history</span>
</button>
<button class="p-xs hover:bg-surface-container rounded-full transition-colors duration-200 active:opacity-70">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</div>
</header>
<main class="mt-16 p-md flex flex-col gap-md">
<!-- Voucher Header Information -->
<section class="bg-surface-container-lowest border border-outline-variant p-md rounded-lg flex flex-col gap-md">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">Voucher Number</span>
<span class="font-label-data text-label-data text-primary px-sm py-1 bg-surface-container rounded">JV-2023-0892</span>
</div>
<div class="flex flex-col gap-xs items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant">Status</span>
<span class="px-sm py-1 bg-secondary-fixed text-on-secondary-fixed text-[11px] font-bold rounded-full border border-secondary-container">DRAFT</span>
</div>
</div>
<div class="grid grid-cols-1 gap-md">
<div class="flex flex-col gap-base">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium">Posting Date</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded p-md text-body-md font-body-md data-dense-input" type="date" value="2023-10-27">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium">Narration / Remarks</label>
<textarea class="w-full bg-surface border border-outline-variant rounded p-md text-body-md font-body-md data-dense-input resize-none" placeholder="Enter purpose of this journal entry..." rows="3">Adjustment for site equipment maintenance and fuel expenses for Project Alpha - Sector 4.</textarea>
</div>
</div>
</section>
<!-- Entry Section (Account Heads) -->
<section class="flex flex-col gap-sm">
<div class="flex justify-between items-center px-xs">
<h2 class="font-title-md text-title-md text-primary uppercase tracking-wider">Line Items</h2>
<span class="font-label-caps text-label-caps text-on-surface-variant">2 Items Added</span>
</div>
<!-- List of Entry Cards -->
<div class="flex flex-col gap-md">
<!-- Entry Card 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded relative overflow-hidden group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary"></div>
<div class="p-md flex flex-col gap-md">
<div class="flex justify-between items-start">
<div class="flex-1">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base block">Account Head</label>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-sm">account_balance_wallet</span>
<span class="font-title-md text-title-md text-primary">Office Maintenance Exp.</span>
</div>
</div>
<button class="p-sm text-error hover:bg-error-container rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="grid grid-cols-2 gap-md border-t border-outline-variant pt-md">
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">Debit</span>
<input class="w-full bg-surface border border-outline-variant rounded p-sm text-label-data text-label-data text-primary focus:border-primary focus:ring-0" type="number" value="12500.00">
</div>
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">Credit</span>
<input class="w-full bg-surface border border-outline-variant rounded p-sm text-label-data text-label-data text-on-surface-variant focus:border-primary focus:ring-0" placeholder="0.00" type="number">
</div>
</div>
</div>
</div>
<!-- Entry Card 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded relative overflow-hidden group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<div class="p-md flex flex-col gap-md">
<div class="flex justify-between items-start">
<div class="flex-1">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base block">Account Head</label>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-sm">payments</span>
<span class="font-title-md text-title-md text-primary">Petty Cash - Site 04</span>
</div>
</div>
<button class="p-sm text-error hover:bg-error-container rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="grid grid-cols-2 gap-md border-t border-outline-variant pt-md">
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">Debit</span>
<input class="w-full bg-surface border border-outline-variant rounded p-sm text-label-data text-label-data text-on-surface-variant focus:border-primary focus:ring-0" placeholder="0.00" type="number">
</div>
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">Credit</span>
<input class="w-full bg-surface border border-outline-variant rounded p-sm text-label-data text-label-data text-primary focus:border-primary focus:ring-0" type="number" value="12500.00">
</div>
</div>
</div>
</div>
<!-- Add New Item Button -->
<button class="w-full flex items-center justify-center gap-sm py-md border-2 border-dashed border-outline-variant rounded text-on-surface-variant hover:bg-surface-container active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-title-md text-title-md">Add New Account Head</span>
</button>
</div>
</section>
<!-- Summary Sticky-ish Section -->
<section class="bg-primary text-on-primary rounded-lg p-md shadow-lg flex flex-col gap-md mt-lg">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-primary-container">JV Summary</span>
<div class="flex items-center gap-xs px-sm py-1 bg-secondary-container text-on-secondary-container rounded-full">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Balanced</span>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-primary-container">JV Summary</span>
<span class="font-label-data text-[18px] text-white">₹12,500.00</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-caps text-label-caps text-on-primary-container">JV Summary</span>
<span class="font-label-data text-[18px] text-white">₹12,500.00</span>
</div>
</div>
<div class="h-px bg-on-primary-fixed-variant opacity-30"></div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-primary-container">Difference</span>
<span class="font-label-data text-label-data text-secondary-fixed">₹0.00</span>
</div>
</section>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest p-md border-t border-outline-variant flex flex-col gap-sm shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
<button class="w-full py-md bg-primary text-on-primary font-title-md text-title-md rounded hover:bg-tertiary transition-all active:scale-[0.98] flex items-center justify-center gap-sm"><span class="material-symbols-outlined">send</span> Submit JV Entry</button>
<button class="w-full py-md bg-transparent text-on-surface-variant border border-outline-variant font-title-md text-title-md rounded hover:bg-surface-container active:scale-[0.98] transition-all">
            Cancel
        </button>
</div>
<!-- Script for interaction logic -->
<script>
        // Simple micro-interaction for entry inputs
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.font-label-caps').classList.add('text-secondary');
                this.parentElement.querySelector('.font-label-caps').classList.remove('text-on-surface-variant');
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.font-label-caps').classList.remove('text-secondary');
                this.parentElement.querySelector('.font-label-caps').classList.add('text-on-surface-variant');
            });
        });

        // Toggle back behavior (simulated)
        document.querySelector('button .material-symbols-outlined[data-icon="arrow_back"]')?.parentElement.addEventListener('click', () => {
            console.log('Navigate back');
        });
    </script>


</body></html>
